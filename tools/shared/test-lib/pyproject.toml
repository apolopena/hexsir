[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-lib"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["click>=8,<9"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["test_lib*"]

[tool.coverage.run]
omit = ["tests/*"]
