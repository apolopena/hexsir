[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "display-lib"
version = "3.0.2"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.4,<1",
]

[tool.coverage.run]
omit = ["tests/*"]
