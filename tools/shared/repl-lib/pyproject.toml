[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repl-lib"
version = "1.1.2"
requires-python = ">=3.12"
dependencies = [
    "display-lib>=3.0.0,<4",
    "prompt-toolkit>=3,<4",
]

[tool.uv.sources]
display-lib = { path = "../display-lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.4,<1",
]

[tool.coverage.run]
omit = ["tests/*"]
