[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-lib"
version = "3.0.3"
requires-python = ">=3.12"
dependencies = ["display-lib>=3.0.0,<4"]

[tool.uv.sources]
display-lib = { path = "../display-lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["tree_lib*"]

[tool.coverage.run]
omit = ["tests/*"]
