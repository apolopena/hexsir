[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexsircli-src"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "display-lib>=3.0.0,<4",
    "click>=8,<9",
]

[project.scripts]
hexsircli = "cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<1",
    "test-lib>=0.1.0,<1",
]

[tool.uv.sources]
display-lib = { path = "../shared/display-lib", editable = true }
test-lib = { path = "../shared/test-lib", editable = true }

[tool.setuptools]
packages = ["commands", "lib", "data"]
py-modules = ["cli"]

[tool.setuptools.package-data]
data = ["**/*"]

[tool.coverage.run]
omit = ["tests/*"]
