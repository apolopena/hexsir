# Save-file field registry for `rerw read savefile` / `rerw write savefile`.
# When a game patch shifts GUIDs, update this file — no code change required.
#
# Schema:
#   <category>.<field_name>:
#     type:        binary value type (int32_le today)
#     guids:       list of 15-byte hex GUIDs (1+, written in lockstep)
#     description: free-form notes

scalar:
  chapter:
    type: int32_le
    guids:
      - 13fa8e2c314d88babb71a8e3c4df01
      - 6661756c746465662e6f7426ba4519
    description: |
      Chapter progression. Values: 0=ch1, 1=ch2, 2=ch3, 3=epilogue.
      Both internal counters set in lockstep.

  level:
    type: int32_le
    guids:
      - b5317efe6f4a95737325675793e600
    description: |
      In-run hero level. Game caps display at 15; save accepts higher.

# Future categories reserved (do NOT remove):
# array:
# ref:

talent_record:
  # Tag=0x12 talent record holding the player's 5 talent picks for the run.
  # Single instance per save. Record GUID + sentinel + slot count are
  # presumed hero-independent (identify the record type in the OEngine
  # schema, not the hero). Verified for Geppetto end-to-end; structure
  # presumed to generalize to other heroes — verifies on first non-Geppetto
  # run (Juliet proof pending). The CLI auto-detects the hero from the save's
  # `Heroes\<Name>.herodef.ot` path string and routes to the matching
  # `heroes/<name>.yaml` skill-controller registry.
  run_picks:
    type: talent_picks
    record_guid: bfe7f6604385cb4887f6b4b79f6812
    skills_data_dir: heroes
    description: |
      Talent picks block: `[u32 N count][N × 16-byte talent GUIDs]`.
      N varies by chapter (5 at chapter-2 entry, up to 10 at epilogue).
      The lib's `find_picks_count` walks back from the run-state-record
      close marker to locate the count u32 — count-agnostic.
      Tag=0x10 first-occurrence records (one per skill controller, near
      the hero record) carry the per-talent rarity byte at offset GUID+17.
      See rw/key-findings/talent-records.md.
