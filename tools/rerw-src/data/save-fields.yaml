# Save-file field registry for `rerw read savefile` / `rerw write savefile`.
# When a game patch shifts GUIDs, update this file — no code change required.
#
# Schema:
#   <category>.<field_name>:
#     type:        binary value type (int32_le today)
#     guids:       list of 15-byte hex GUIDs (1+, written in lockstep)
#     description: free-form notes

scalar:
  chapter:
    type: int32_le
    guids:
      - 13fa8e2c314d88babb71a8e3c4df01
      - 6661756c746465662e6f7426ba4519
    description: |
      Chapter progression. Values: 0=ch1, 1=ch2, 2=ch3, 3=epilogue.
      Both internal counters set in lockstep.

  level:
    type: int32_le
    guids:
      - b5317efe6f4a95737325675793e600
    description: |
      In-run hero level. Game caps display at 15; save accepts higher.

