# Magical Object catalog — extracted from cooked entity-settings files.
#
# Source: EntitySettings/Obzects/Magical_Obzects!<Rarity>!<Effect>.entity.ot.EntitySettingsResource.gen
# Each entry maps an effect filename to its 16-byte runtime GUID (used in
# tag=0x1a active-item records inside the run-state record).
#
# `display_name` is the player-facing item name. ONE entry is enough — the resolver
# normalizes case, whitespace, dashes, underscores. So `display_name: "Vorpal Blade"`
# accepts user input "vorpal blade", "Vorpal_Blade", "VorpalBlade", "VORPAL-BLADE", etc.
#
# Entries with `displays_as` are GHOSTS — deprecated catalog entities still
# resolvable in the save's active-item record but rerouted to display as a
# different live item via inheritance in the cooked entity file.
# Ghost convention:
#   - display_name prefixed with "Ghost <original-player-name>"
#   - displays_as: <live-item alias as shown in HUD>
#   - inherits_from: <live entity's effect filename>
#   - meta_notes: combined-effect description (verbatim wiki text where available)
# See `rw/key-findings/item-table.md` for full per-item details (icons, name keys, catalog GUIDs).

