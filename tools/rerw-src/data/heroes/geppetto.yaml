# Source: Heroes/Geppetto.herodef.ot.DtHeroDefinition.gen
# Each entry maps a herodef-internal Skill Controller name to its 16-byte GUID.
# When the player picks a talent in-game, the save records that controller's
# GUID in the slot. Tier is stored in a separate tag=0x10 record near the
# hero record (see save-fields.yaml/talent_record + key-findings/talent-records.md).
#
# `aliases` are player-facing talent names. ONE entry is enough — the resolver
# normalizes case, whitespace, dashes, underscores, and the "Skill Controller "
# prefix automatically. So `aliases: ["Twin Dummies"]` accepts user input
# "twin dummies", "Twin_Dummies", "TwinDummies", "TWIN-DUMMIES", etc.

