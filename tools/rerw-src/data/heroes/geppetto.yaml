# Geppetto skill controllers — extracted from the herodef binary.
#
# Source: Heroes/Geppetto.herodef.ot.DtHeroDefinition.gen
# Each entry maps a herodef-internal Skill Controller name to its 16-byte GUID.
# When the player picks a talent in-game, the save records that controller's
# GUID in the slot. Tier is stored in a separate tag=0x10 record near the
# hero record (see save-fields.yaml/talent_record + key-findings/talent-records.md).
#
# `aliases` are player-facing talent names. ONE entry is enough — the resolver
# normalizes case, whitespace, dashes, underscores, and the "Skill Controller "
# prefix automatically. So `aliases: ["Twin Dummies"]` accepts user input
# "twin dummies", "Twin_Dummies", "TwinDummies", "TWIN-DUMMIES", etc.

controllers:
  - display_name: "Rocket Science"
    key: RocketScience
    controller_name: "Skill Controller Dash Deals Damage"
    guid: 3eb79ea457a27c4cba0f4c3bb5d91e17
    is_start: true
    desc: |
      DASH can be held for up to 1 second(s), dealing 32 damage along its path and applying IGNITE to all enemies hit. Crossed DUMMIES catch fire and increase their attack rate by 25% for 5 seconds.
      Changes per rarity:
      +8 damage + Hero Level + DMG / Epic & Legendary: +5% attack rate

  - display_name: "Dummyball"
    key: Dummyball
    controller_name: "Skill Controller Special Creates Dummy"
    guid: 830f33de77f48c4f92169cdf1aa2a1d2
    is_start: true
    desc: |
      SPECIAL creates a DUMMY when it explodes and deals 155% damage. Has no effect if the max number of DUMMIES are already active.
      Changes per rarity:
      +15% damage

  - display_name: "Twin Dummies"
    key: TwinDummies
    controller_name: "Skill Controller Trait Twins"
    guid: 33cdbac4ce86134da99bc59a19021b6a
    is_start: true
    desc: |
      TRAIT has 55% chance to build two DUMMIES at once.
      Changes per rarity:
      +15% chance

  - display_name: "Unstable Cores"
    key: UnstableCores
    controller_name: "Skill Controller Power Unstable"
    guid: b16d6d4efbabf9419d1ef8929840eeba
    is_start: true
    desc: |
      5 seconds after their creation, DUMMIES become UNSTABLE. If an unstable DUMMY is hit with POWER - or if it is destroyed or dismantled - this will cause it to explode, dealing 80 area damage.
      Changes per rarity:
      +10 area damage + Hero Level + DMG

  - display_name: "Meca-Puppet"
    key: MecaPuppet
    controller_name: "Skill Controller Ultimate Power 1"
    guid: f156f2f780a5544d8ea36e1cc8f0e4eb
    is_ult: true
    desc: |
      Create an autonomous giant PUPPET that will attack the closest target and deal up to 77 damage per second. PUPPET follows Geppetto if no target is nearby and lasts up to 40 seconds.

  - display_name: "Overclock"
    key: Overclock
    controller_name: "Skill Controller Ultimate Power 2"
    guid: c559438ca1eada438da879cd444c12d0
    is_ult: true
    desc: |
      Make all active DUMMIES spin around and track nearby enemies, each one dealing 50 per second all around. DUMMIES under the effect of Overclock are INTANGIBLE. Cooldown is proportional to the number of DUMMIES affected.

  - display_name: "Bomb Reserve"
    key: BombReserve
    controller_name: "Skill Controller Ultimate 1 Upgrade 1"
    guid: 49c048d36106174286c73433919c150f
    ult_upgrade_for: "MecaPuppet"
    desc: |
      When in combat, PUPPET sends a bomb around itself every 1 second(s), dealing 40 area damage.
      Changes per rarity:
      +50 area damage + Hero Level + DMG

  - display_name: "Master Puppet"
    key: MasterPuppet
    controller_name: "Skill Controller Ultimate 2 Upgrade 1"
    guid: cab3e19fc15d1a4bb60c2deb994c7553
