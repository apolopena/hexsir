    controller_name: "Skill Controller Power Shatter"
    guid: c74edffbce2fa946bdfbe6f662d12c73
    desc: |
      POWER triggers SHATTER when hitting enemies that are already CHILLED. Each SHATTER deals +20% damage.
      Changes per rarity:
      +5% damage

  - display_name: "Lance Burst"
    key: LanceBurst
    controller_name: "Skill Controller Trait Sends Attacks"
    guid: 9e8ba6354cfd2046b6519449dbb4bc8d
    desc: |
      TRAIT sends 3 ATTACKS forward in a cone-shaped burst.
      Changes per rarity:
      +1 ATTACKS

  - display_name: "Slide"
