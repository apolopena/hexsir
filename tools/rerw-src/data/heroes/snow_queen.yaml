    controller_name: "Skill Controller Special Double"
    guid: 4e4112f44d61c140b251db695c6f60e3
    desc: |
      SPECIAL sprays two bursts of ice shards in opposite directions, dealing +20% damage to CHILLED enemies.
      Changes per rarity:
      +5% damage

  - display_name: "Flurry of Shards"
