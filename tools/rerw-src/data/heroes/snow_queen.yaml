    controller_name: "Skill Controller Power Ice Waves"
    guid: 588ac025ff90694ea589ec42ae17abe6
    desc: |
      After using POWER, 3 waves of ice strike the area and deal 20 damage each.
      Changes per rarity:
      +1 wave(s)

  - display_name: "Shattering Blast"
