    controller_name: "Skill Controller Power Hold"
    guid: 27a641d018efdc4dbb8b191c837c5f58
    desc: |
      POWER can be held to store up to 3 levels of charge before being released. Each charge level increases damage dealt by 20% and the effect radius by 10%.
      Changes per rarity:
      +5% damage

  - display_name: "Hailstorm"
