# Snow_Queen skill controllers — extracted from the herodef binary.
#
# Source: Heroes/Snow_Queen.herodef.ot.DtHeroDefinition.gen
# `key` is the strict CLI value for talent lookup. Display names and controller
# names are metadata only; commands do not fuzzy-match them.

schema_version: "1.0.0"
registry_id: hero_talents
hero:
  key: snow_queen
  engine_name: "Snow_Queen"

controllers:
  - display_name: "Dual Lances"
    key: DualLances
    controller_name: "Skill Controller Attack Dual"
    guid: f2bf2cdde89f60488dbbc30df0b030d3
    is_start: true
    desc: |
      ATTACK sends forth two lances side by side, but the maximum range is reduced by 45%. Each lance deals 70% damage.
      Changes per rarity:
      +10% damage

  - display_name: "Frost Queen"
    key: FrostQueen
    controller_name: "Skill Controller Passive Better Frost"
    guid: 7b9b43896525514da96539f1edb9771a
    is_start: true
    desc: |
      Frost generated by your abilities remain on the ground for 2 seconds. CHILLED effects slow enemies by an additional 20%.
      Changes per rarity:
      +1 second(s)

  - display_name: "Rupture"
    key: Rupture
    controller_name: "Skill Controller Trait Quest"
    guid: 35dd1153d33411419f453384b6ce4454
    is_start: true
    desc: |
      Quest (x20): SHATTER 2 enemies with a single TRAIT to earn +0.5 DMG. Complete: SHATTER leaves affected enemies VULNERABLE for 4 seconds.
      Changes per rarity:
      +1 second(s)

  - display_name: "Ice Clone"
    key: IceClone
    controller_name: "Skill Controller Defense Clone"
    guid: ff84ba0f0ed99e4c879a8c69949eefda
    is_start: true
    desc: |
      DEFENSE leaves an ice clone with 40% of Hero's Maximum Health, attracting enemies' attention. When destroyed or after 10 seconds have passed, it deals 40 area damage and inflicts CHILLED to enemies hit.
      Changes per rarity:
      +20 area damage + Hero Level + DMG

  - display_name: "Frost Ray"
    key: FrostRay
    controller_name: "Skill Controller Ultimate Power 1"
    guid: f156f2f780a5544d8ea36e1cc8f0e4eb
    is_ult: true
    desc: |
      Channel a Frost Ray to the ground, dealing 160 damage per second and applying CHILLED to hit enemies. The Snow Queen can still be damaged while channeling Frost Ray. Frost Ray can be cancelled early and its cooldown is proportional to the time it has been used (with a minimum of 10s).

  - display_name: "Snowstorm"
    key: Snowstorm
    controller_name: "Skill Controller Ultimate Power 2"
    guid: c559438ca1eada438da879cd444c12d0
    is_ult: true
    desc: |
      Summon a snow storm to deal 5 damage per second, inflicting all enemies within range with CHILLED. The effect lasts for 10 seconds.

  - display_name: "Royal Ray"
    key: RoyalRay
    controller_name: "Skill Controller Ultimate 1 Upgrade 1"
    guid: 49c048d36106174286c73433919c150f
    ult_upgrade_for: "FrostRay"
    desc: |
      When ULTIMATE is triggered, TRAIT is also cast, dealing 8% damage for each shattered enemy (up to 40%).
      Changes per rarity:
      +2% (up to +10%)

  - display_name: "Ice Beam"
    key: IceBeam
    controller_name: "Skill Controller Ultimate 2 Upgrade 1"
    guid: cab3e19fc15d1a4bb60c2deb994c7553
    ult_upgrade_for: "FrostRay"
    desc: |
      ULTIMATE now channels an ice beam, dealing 160% damage and inflicting CHILLED to the first enemy hit.
      Changes per rarity:
      +40% damage

  - display_name: "Rending Storm"
    key: RendingStorm
    controller_name: "Skill Controller Ultimate 1 Upgrade 2"
    guid: 4433ba05e980cb468f7672b3f4921706
    ult_upgrade_for: "Snowstorm"
    desc: |
      Each time The Snow Queen casts TRAIT, POWER, or SPECIAL within the ULTIMATE zone, the storm unleashes a burst dealing 20 damage.
      Changes per rarity:
      +5 damage + Hero Level + DMG

  - display_name: "Shattering Storm"
    key: ShatteringStorm
    controller_name: "Skill Controller Ultimate 2 Upgrade 2"
    guid: 8167cd9f423b4042bc07135d68f4a5a3
    ult_upgrade_for: "Snowstorm"
    desc: |
      When ULTIMATE effect ends, zone explodes and SHATTERS all enemies inside, dealing 72 damage.
      Changes per rarity:
      +18 damage + Hero Level + DMG

  - display_name: "Windy Lances"
    key: WindyLances
    controller_name: "Skill Controller Attack Seeking"
    guid: 05e868b482cd2b4b9edc8c15e2581214
    desc: |
      ATTACK's lances can curve to seek out targets, and their duration resets whenever they hit an enemy, up to 3 times.
      Changes per rarity:
      +1 duration reset

  - display_name: "Ice Shield"
    key: IceShield
    controller_name: "Skill Controller Defense Shield"
    guid: acbf3429f411ca449145921c54512523
    desc: |
      DEFENSE grants 16 SHIELD to The Snow Queen and all Heroes passed for 6 seconds.
      Changes per rarity:
      +4 SHIELD + Hero Level

  - display_name: "Cold Heart"
    key: ColdHeart
    controller_name: "Skill Controller Passive Chilled Crit"
    guid: 84a020c97e1d654493679642b9d6204a
    desc: |
      Gain 4% Crit Chance for each CHILLED enemy nearby (can stack up to 5 times).
      Changes per rarity:
      +1% Crit Chance

  - display_name: "Frost Surge"
