      +3% damage per Cursed Magical Object

  - display_name: "Wild Magic"
    key: WildMagic
    controller_name: "Skill Controller Attack Bleed After Power"
    guid: 26617a03514a1c4ea4591f3b3b3fb12e
    desc: |
      After casting a Nature Spell (POWER), the next 3 ATTACKS also project thorns dealing 200% damage as BLEED.
      Changes per rarity:
      +50% damage as BLEED

  - display_name: "Sacred Ground"
    key: SacredGround
    controller_name: "Skill Controller Defense Defense DMG Buff Zone"
    guid: fc1c6ada34ce77418108e2d34830c74a
    desc: |
      After casting the Blink Spell, a sacred area will appear on the ground for 5 seconds. All heroes inside the area will gain +40 DMG.
