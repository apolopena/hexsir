    controller_name: "Skill Controller Passive Crit Chance On Status"
    guid: 13a2117e7bd49149b85717de576dee25
    desc: |
      All of Merlin's Abilities have +16% Crit Chance on enemies afflicted by the IGNITE or CHILLED status (both can stack).
