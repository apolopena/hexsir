      TRAIT triggers a lightning strike on up to 4 nearby enemies. Lightning strikes deal 80 damage each and are stronger if fewer enemies are nearby.
      Changes per rarity:
      +1 nearby enemy

  - display_name: "Grace of Heaven"
    key: GraceOfHeaven
    controller_name: "Skill Controller Trait Reduce Cooldown After Defense"
    guid: c88982289c6503458220b5fc06c09a3f
    desc: |
      Casting a Sacred Spell (DEFENSE) reduces TRAIT cooldown by 4 seconds.
      Changes per rarity:
      +1 second(s)

  - display_name: "Sacred Strike"
