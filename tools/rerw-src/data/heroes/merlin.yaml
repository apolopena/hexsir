# Merlin skill controllers — extracted from the herodef binary.
#
# Source: Heroes/Merlin.herodef.ot.DtHeroDefinition.gen
# `key` is the strict CLI value for talent lookup. Display names and controller
# names are metadata only; commands do not fuzzy-match them.

schema_version: "1.0.0"
registry_id: hero_talents
hero:
  key: merlin
  engine_name: "Merlin"

controllers:
  - display_name: "Runic Might"
    key: RunicMight
    controller_name: "Skill Controller Passive Quest Crit Chance"
    guid: b324e52a36d8264bbbea06eb240061cb
    is_start: true
    desc: |
      Quest (x20): In combat, casting a Spell that consumes 3 runes of POTENCY earns +0.5 DMG. Complete: Taking this action a second time makes the Spell cast gain +20% Crit Chance.
      Changes per rarity:
      +5% Crit Chance

  - display_name: "Trinity"
    key: Trinity
    controller_name: "Skill Controller Trait Quest Gain Charge"
    guid: a63bdc44618a674a95f6ed7d4b25fa8c
    is_start: true
    desc: |
      Quest (x3): Collect Excalibur, the Holy Grail, or Father Time's Hourglass to gain +1 Star(s) of Fate. Complete: Gain +1 TRAIT charge and all critical damage will increase by 40%.
      Changes per rarity:
      +10% critical damage

  - display_name: "Astrology"
    key: Astrology
    controller_name: "Skill Controller Passive Gain Reroll High Talent"
    guid: e4ccb4fcc9b76040b115d929e9f03e84
    is_start: true
    desc: |
      Gain +3 Star(s) of Fate. Future Talents have a +15% chance of being Rare or above.
      Changes per rarity:
      +10% chance

  - display_name: "Eternal Dream"
    key: EternalDream
    controller_name: "Skill Controller Passive Repeatable Quest Gain DS"
    guid: 49a7776abda8184babc2f63672fc4b90
    is_start: true
    desc: |
      Each time Merlin casts his nine different Spells, he gains 30 Dream Shards. Does not work within a Safe Zone or during Chapter Boss fights.
      Changes per rarity:
      +10 Dream Shards

  - display_name: "Standing Stone"
    key: StandingStone
    controller_name: "Skill Controller Ultimate Power 1"
    guid: f156f2f780a5544d8ea36e1cc8f0e4eb
    is_ult: true
    desc: ""

  - display_name: "Forbidden Spells"
    key: ForbiddenSpells
    controller_name: "Skill Controller Ultimate Power 2"
    guid: c559438ca1eada438da879cd444c12d0
    is_ult: true
    desc: |
      Prepares a Forbidden Spell, to be cast as the next ability used. Using CONTEXTUAL ACTION will cancel this preparation action. POWER: Cataclysm — Summons a meteorite from the sky, the impact area of which can be moved around for a short time before it hits. The meteorite then strikes the targeted location, dealing 500 damage in a large area surrounding it. Merlin can still be damaged while channeling.

  - display_name: "Energy Stone"
    key: EnergyStone
    controller_name: "Skill Controller Ultimate 1 Upgrade 1"
    guid: 49c048d36106174286c73433919c150f
    ult_upgrade_for: "StandingStone"
    desc: |
      For every 10% health lost, Standing Stone emits a blast toward a nearby enemy, dealing 30 damage.
      Changes per rarity:
      Rare & Legendary: +7 damage + Hero Level + DMG / Epic: +8 damage + Hero Level + DMG

  - display_name: "Dark Swiftness"
    key: DarkSwiftness
    controller_name: "Skill Controller Ultimate 1 Upgrade 2"
    guid: 4433ba05e980cb468f7672b3f4921706
    ult_upgrade_for: "ForbiddenSpells"
    desc: |
      DASH can be held up to 0.5 second(s) to deal 60 damage to enemies passed through.
      Changes per rarity:
      +15 damage + Hero Level + DMG

  - display_name: "Megalithic Site"
    key: MegalithicSite
    controller_name: "Skill Controller Ultimate 2 Upgrade 1"
    guid: cab3e19fc15d1a4bb60c2deb994c7553
    ult_upgrade_for: "StandingStone"
    desc: |
      Merlin extracts 3 standing stones from the ground around him, with each one dealing 80% damage when destroyed.
      Changes per rarity:
      +20% damage

  - display_name: "Corrupted Arts"
    key: CorruptedArts
    controller_name: "Skill Controller Ultimate 2 Upgrade 2"
    guid: 8167cd9f423b4042bc07135d68f4a5a3
    ult_upgrade_for: "ForbiddenSpells"
    desc: |
      Forbidden Spells (ULTIMATE) deal +12% damage per Cursed Magical Object owned.
