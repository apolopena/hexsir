    controller_name: "Skill Controller Defense Attack Finisher"
    guid: 1046f81e244d404ca51d4a4a33b68e6d
    desc: |
      After casting a Sacred Spell (DEFENSE), Merlin's next ATTACK will be a finisher that conjures a rune of POTENCY if it hits an enemy and deals 320% damage.
