[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scafcli-src"
version = "4.2.1"
requires-python = ">=3.12"
dependencies = [
    "display-lib>=3.0.0,<4",
    "tree-lib>=3.0.0,<4",
    "click>=8.1,<9",
    "jsonschema>=4.23,<5",
]

[project.scripts]
scafcli = "cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.4,<1",
    "test-lib>=0.1.0,<1",
]

[tool.uv.sources]
display-lib = { path = "../shared/display-lib", editable = true }
tree-lib = { path = "../shared/tree-lib", editable = true }
test-lib = { path = "../shared/test-lib", editable = true }

[tool.setuptools]
packages = ["lib", "commands", "data"]
py-modules = ["cli"]

[tool.setuptools.package-data]
data = ["**/*"]

[tool.ruff]
# extend- (not bare exclude) preserves ruff defaults (.venv, node_modules, etc.)
extend-exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Golden fixtures contain scaffolded test files - exclude from collection
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
omit = ["tests/*"]
